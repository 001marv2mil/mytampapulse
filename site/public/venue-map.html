<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c0a08; }
  #map { width: 100%; height: 100%; }
  .leaflet-popup-content-wrapper {
    background: #1a1208;
    color: #F0D488;
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .leaflet-popup-tip-container .leaflet-popup-tip { background: #1a1208; }
  .leaflet-popup-content { margin: 10px 14px; font-family: sans-serif; font-size: 13px; line-height: 1.5; }
  .leaflet-container a { color: #F0D488; }
  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  const lat = 27.9474, lng = -82.4588;
  const map = L.map('map', { zoomControl: true }).setView([lat, lng], 17);
  // Hybrid view: satellite imagery + roads + place labels (like Google's satellite mode)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Imagery &copy; Esri'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);
  L.marker([lat, lng])
    .addTo(map)
    .bindPopup('<strong style="color:#F0D488;font-size:14px">Hyatt Place Downtown Tampa</strong><br><span style="color:#ccc">325 N Florida Ave, Tampa</span>')
    .openPopup();
</script>
</body>
</html>
