name: Send Weekly Newsletter

# Fires multiple times across Thursday morning UTC so that even with GitHub
# Actions' free-tier cron delays (docs warn 1-3 hours, sometimes skipped),
# at least one attempt lands at a reasonable time. The dedup logic in
# /api/send-newsletter (uses newsletter_sends table with UNIQUE constraint)
# guarantees subscribers only receive ONE email no matter how many times
# this fires successfully.
#
# Target wall-clock: 8:00 AM Eastern Time.
#   - During EDT (March-November): 8 AM ET = 12:00 UTC
#   - During EST (November-March): 8 AM ET = 13:00 UTC
# Schedules below blanket roughly 6 AM - 10 AM ET to catch both DST states
# plus GitHub delay tolerance.

on:
  schedule:
    - cron: '0 10 * * 4'   # Thu 10:00 UTC (6 AM EDT / 5 AM EST)
    - cron: '30 10 * * 4'  # Thu 10:30 UTC
    - cron: '0 11 * * 4'   # Thu 11:00 UTC (7 AM EDT / 6 AM EST)
    - cron: '30 11 * * 4'  # Thu 11:30 UTC
    - cron: '0 12 * * 4'   # Thu 12:00 UTC (8 AM EDT - DST target)
    - cron: '30 12 * * 4'  # Thu 12:30 UTC
    - cron: '0 13 * * 4'   # Thu 13:00 UTC (8 AM EST - standard-time target)
    - cron: '0 14 * * 4'   # Thu 14:00 UTC (10 AM EDT - final fallback)
  workflow_dispatch:
    # Manual trigger from GitHub Actions tab anytime

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter send
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.mytampapulse.com/api/send-newsletter" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "ERROR: Newsletter send failed with status $status"
            exit 1
          fi

          # Parse sent count for visibility in run logs
          sent=$(echo "$body" | grep -oE '"sent":[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -n "$sent" ]; then
            echo "Sent count: $sent"
            if [ "$sent" = "0" ]; then
              echo "NOTE: sent=0 likely means an earlier fire today already delivered to all subscribers (dedup working as expected)."
            fi
          fi

          echo "Workflow completed successfully."
