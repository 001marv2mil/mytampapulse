name: Send Weekly Newsletter

# Backup safety net only — primary cron is Vercel's built-in cron service
# (configured in site/vercel.json) which is reliable on Pro tier. This GitHub
# Actions workflow fires once a week as a fallback in case Vercel's cron
# ever fails. The /api/send-newsletter endpoint dedups via the
# newsletter_sends UNIQUE constraint so duplicate fires never produce
# duplicate emails.

on:
  schedule:
    # Every Thursday at 13:00 UTC = 9 AM EDT / 8 AM EST.
    # One hour after Vercel's primary 12:00 UTC fire, so if Vercel succeeded
    # this run will see 0 new subscribers and exit clean.
    - cron: '0 13 * * 4'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab anytime

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger newsletter send
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.mytampapulse.com/api/send-newsletter" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300)

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "HTTP Status: $status"
          echo "Response: $body"

          if [ "$status" != "200" ]; then
            echo "ERROR: Newsletter send failed with status $status"
            exit 1
          fi

          echo "Workflow completed successfully."
